readme = "README.md"
authors = [
    { name = "ananya", email = "ananyabagla584@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.2",
    "langchain-core>=1.6.4",
    "langchain-openai>=1.6.3",
    "pandas>=3.0.6",
